# Roma ERP — production stack.
# Services:
#   db      — PostgreSQL 16
#   web     — Django app via gunicorn
#   nginx   — reverse proxy + HTTPS (via Let's Encrypt)
#   certbot — renews the SSL cert on a schedule
#
# Usage:
#   1. Copy `.env.example` to `.env` and fill it in.
#   2. Run `docker compose up -d --build`.
#   3. Set up the cert once:  `docker compose run --rm certbot certonly \
#         --webroot -w /var/www/certbot -d $DOMAIN --email $LE_EMAIL --agree-tos --no-eff-email`

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roma}
      POSTGRES_USER: ${POSTGRES_USER:-roma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgres://${POSTGRES_USER:-roma}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-roma}
    volumes:
      - media_data:/app/media
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py seed_coa &&
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 3
          --timeout 150
          --access-logfile -
          --error-logfile -
      "

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
      - media_data:/srv/media:ro
    environment:
      DOMAIN: ${DOMAIN}

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
      - ./deploy/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  media_data:
