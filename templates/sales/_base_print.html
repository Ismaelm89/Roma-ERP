<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Roma ERP{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #111;
    --muted: #555;
    --line: #ddd;
    --soft: #f5f5f5;
    --brand: #2b3a55;
}
* { box-sizing: border-box; }
body {
    font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
    direction: rtl;
    color: var(--ink);
    margin: 0;
    padding: 24px;
    background: #fafafa;
    font-size: 14px;
    line-height: 1.5;
}
.page {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 28px 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}
.toolbar {
    max-width: 900px;
    margin: 0 auto 16px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
}
.btn {
    background: var(--brand);
    color: white;
    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    text-decoration: none;
    display: inline-block;
}
.btn.secondary {
    background: white;
    color: var(--brand);
    border: 1px solid var(--brand);
}
h1 { margin: 0 0 4px; font-size: 22px; color: var(--brand); }
h2 { margin: 18px 0 8px; font-size: 16px; color: var(--brand); }
.muted { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th { background: var(--soft); font-weight: 600; }
td.num, th.num { text-align: left; font-variant-numeric: tabular-nums; }
.totals { margin-top: 16px; }
.totals td { border-bottom: none; padding: 4px 10px; }
.totals .grand { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); }
.header-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--brand);
}
.company-block .logo { max-height: 60px; margin-bottom: 6px; }
.meta-block { text-align: left; }
.meta-block .label { color: var(--muted); font-size: 12px; }
.party {
    padding: 10px 12px;
    background: var(--soft);
    border-radius: 6px;
}
.footer-note {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    color: var(--muted);
    font-size: 12px;
}

/* موبايل: حشو أصغر + الجداول العريضة بتتسحب أفقياً جوّه الصفحة بدل ما تكسر الشاشة. */
@media screen and (max-width: 768px) {
    body { padding: 8px; font-size: 13px; }
    .toolbar { flex-wrap: wrap; gap: 6px; }
    .btn { padding: 8px 12px; font-size: 13px; }
    .page { padding: 14px 10px; border-radius: 6px; }
    h1 { font-size: 18px; }
    table { display: block; overflow-x: auto; white-space: nowrap;
            -webkit-overflow-scrolling: touch; }
    th, td { padding: 6px 8px; }
    .header-grid { grid-template-columns: 1fr; }
    .meta-block { text-align: right; }
}

@media print {
    body { background: white; padding: 0; }
    .toolbar, .no-print { display: none !important; }
    .page { box-shadow: none; border: none; border-radius: 0; max-width: none; padding: 0; }
    @page { size: A4; margin: 14mm; }
}
</style>
</head>
<body>
<div class="toolbar no-print">
{% block toolbar %}
    <a class="btn" href="javascript:window.print()">🖨️ طباعة / حفظ PDF</a>
    <a class="btn secondary" href="javascript:window.close()">إغلاق</a>
{% endblock %}
</div>
{% block page_wrapper %}
<div class="page">{% block content %}{% endblock %}</div>
{% endblock %}
</body>
</html>
