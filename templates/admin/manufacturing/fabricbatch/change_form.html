{% extends "admin/change_form.html" %}
{% load i18n admin_modify %}

{% block submit_buttons_bottom %}
{% submit_row %}
{% if not original or not original.is_posted %}
<div class="submit-row" style="margin-top:-12px;background:transparent;border:none;">
    <input type="submit" value="✅ حفظ وترحيل (قيد محاسبي + إضافة للمخزن)"
           name="_save_and_post"
           style="background:#15803d;color:white;font-weight:700;padding:10px 18px;
                  border:none;border-radius:4px;cursor:pointer;font-size:14px;">
    <span style="margin-right:12px;color:#666;font-size:12px;">
        ← أو استخدم زرار "حفظ" فوق لو عايز تحفظها كمسودة بدون ترحيل
    </span>
</div>
{% endif %}
{% endblock %}
