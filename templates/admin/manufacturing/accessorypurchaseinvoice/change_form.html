{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if original and not original.is_posted %}
  <div class="submit-row" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 8px;">
    <input type="submit" value="✓ حفظ وترحيل الفاتورة" name="_save_and_post"
           style="background: #2b8a3e; color: white; border: 0; padding: 10px 18px; cursor: pointer; font-weight: 700; border-radius: 6px;"
           onclick="return confirm('متأكد من ترحيل الفاتورة؟ هيتعمل قيد محاسبي واحد لكل البنود وكل صنف إكسسوار هيزيد رصيده.');">
  </div>
  <p class="help" style="margin-top:6px;">احفظ الأول عشان تضيف البنود، وبعدين دوس "حفظ وترحيل الفاتورة".</p>
  {% endif %}
{% endblock %}
