{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if show_post_button or show_cancel_button %}
  <div class="submit-row" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 8px;">
    {% if show_post_button %}
      <input type="submit" value="✓ ترحيل سند الصرف" name="_post_voucher"
             style="background: #2b8a3e; color: white; border: 0; padding: 10px 18px; cursor: pointer; font-weight: 700; border-radius: 6px;"
             onclick="return confirm('متأكد من ترحيل هذا السند؟ سيتم إنشاء قيد محاسبي.');">
    {% endif %}
    {% if show_cancel_button %}
      <input type="submit" value="✗ إلغاء السند" name="_cancel_voucher"
             style="background: #b71c1c; color: white; border: 0; padding: 10px 18px; cursor: pointer; font-weight: 700; border-radius: 6px;"
             onclick="return confirm('متأكد من إلغاء هذا السند؟');">
    {% endif %}
  </div>
  {% endif %}
{% endblock %}
