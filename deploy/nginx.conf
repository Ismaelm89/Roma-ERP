# Roma ERP — nginx reverse proxy.
# `${DOMAIN}` is set via the `DOMAIN` env var passed by docker-compose
# (note: nginx doesn't templatize files natively — for one-domain setup we
# rely on `server_name _;` accepting any host, then the SSL cert binds it
# to the actual domain via certbot's auto-issued certificate).

# HTTP → HTTPS redirect + Let's Encrypt webroot challenge
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — actual app traffic
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL certificates from Let's Encrypt (set up by certbot)
    # On the first run before certbot succeeds, comment these out + the listen 443 line.
    ssl_certificate     /etc/letsencrypt/live/COMFIT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/COMFIT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25M;  # for image uploads on items

    # Media files (uploaded images) served directly by nginx
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
    }

    # Everything else → Django via gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
